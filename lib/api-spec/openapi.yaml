openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Creator Studio by AIMD API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary and activity
  - name: habits
    description: Habit tracking operations
  - name: studio-posts
    description: Public studio log posts
  - name: workshops
    description: Workshop and course operations
  - name: enrollments
    description: User enrollment operations
  - name: assignments
    description: Assignment submission and review
  - name: badges
    description: Badge and achievement operations
  - name: job-listings
    description: Studio job board
  - name: applications
    description: Job applications
  - name: skill-tracks
    description: Skill certification tracks
  - name: events
    description: Community events and pop-ups
  - name: sponsorships
    description: Sponsor a Creator donations
  - name: payments
    description: Stripe payment and subscription operations
  - name: store
    description: AIMD storefront catalog, checkout, and orders
  - name: users
    description: User profile and creator directory
  - name: conversations
    description: Messaging and conversations
  - name: moderation
    description: Community safety reports and blocking
  - name: progress
    description: Creator progress, daily check-in, streaks, phases, and badges
  - name: rewards
    description: Daily reward spin and AIMD Points
  - name: challenges
    description: Weekly creative challenge submissions and voting
  - name: instructor
    description: Instructor self-service, curriculum management, submission review, and admin mentor linking

paths:
  # ── Storage ───────────────────────────────────────────────────────────────────
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity-feed:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Recent activity feed (posts + habit logs)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Habits ────────────────────────────────────────────────────────────────
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List user habits
      responses:
        "200":
          description: User habits with tier limit metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitList"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/heatmap:
    get:
      operationId: getHabitHeatmap
      tags: [habits]
      summary: Get activity heatmap data for the past year
      responses:
        "200":
          description: Heatmap data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapDay"

  /habits/milestones:
    get:
      operationId: getPracticeMilestones
      tags: [habits]
      summary: Five-day weeks and four-week practice streaks in Los Angeles time
      responses:
        "200":
          description: Current four-week cycle across all habits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeMilestones"

  /habits/{id}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/log:
    post:
      operationId: logHabitSession
      tags: [habits]
      summary: Log a completed habit session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLogInput"
      responses:
        "201":
          description: Created log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitLog"

  /habit-logs:
    get:
      operationId: listHabitLogs
      tags: [habits]
      summary: Get log history for a habit
      parameters:
        - name: habitId
          in: query
          required: true
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Habit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitLog"

  # ── Studio Posts ──────────────────────────────────────────────────────────
  /studio-posts:
    get:
      operationId: listStudioPosts
      tags: [studio-posts]
      summary: List public studio log posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: followingOnly
          in: query
          description: Use the exact string true for creators followed by the signed-in user, or false for all visible creators. Requires authentication when true.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "200":
          description: Studio posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioPost"
    post:
      operationId: createStudioPost
      tags: [studio-posts]
      summary: Create a studio log post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"

  /studio-posts/{id}:
    get:
      operationId: getStudioPost
      tags: [studio-posts]
      summary: Get a studio post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Studio post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"
    patch:
      operationId: updateStudioPost
      tags: [studio-posts]
      summary: Update the caption on an owned studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudioPostInput"
      responses:
        "200":
          description: Updated studio post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"
        "400":
          description: Invalid caption
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned by the caller
    delete:
      operationId: deleteStudioPost
      tags: [studio-posts]
      summary: Delete a studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /studio-posts/{id}/category:
    patch:
      operationId: updateStudioPostCategory
      tags: [studio-posts]
      summary: Assign an owned studio post to a portfolio category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudioPostCategoryInput"
      responses:
        "200":
          description: Updated studio post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"
        "400":
          description: Invalid category
        "401":
          description: Authentication required
        "404":
          description: Post not found or not owned by the caller

  /studio-posts/{id}/like:
    post:
      operationId: likeStudioPost
      tags: [studio-posts]
      summary: Retired feed likes endpoint
      deprecated: true
      description: Feed engagement uses direct messages. This endpoint returns 410 without modifying historical likes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "410":
          description: Feed likes are retired; message the creator directly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedInteractionUnavailable"

  # ── Workshops ─────────────────────────────────────────────────────────────
  /workshops:
    get:
      operationId: listWorkshops
      tags: [workshops]
      summary: List available workshops & masterclasses
      parameters:
        - name: tier
          in: query
          schema:
            type: ["string", "null"]
            enum: ["free", "workshop", "academy", "pro", null]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workshop"

  /workshops/{id}:
    get:
      operationId: getWorkshop
      tags: [workshops]
      summary: Get workshop details with modules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workshop with modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopDetail"

  /workshops/{id}/enroll:
    post:
      operationId: enrollInWorkshop
      tags: [workshops]
      summary: Enroll current user in a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Enrollment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /workshops/{id}/modules/{moduleId}/playback:
    post:
      operationId: createWorkshopLessonPlayback
      tags: [workshops]
      summary: Verify active subscription or participant enrollment and issue expiring private lesson playback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Private playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopLessonPlayback"
        "403":
          description: Active Dedicated Artist membership or workshop participant enrollment required

  /instructor/workshops/{workshopId}/videos/request-upload:
    post:
      operationId: requestWorkshopVideoUpload
      tags: [workshops]
      summary: Request a direct-to-storage video upload for an assigned workshop
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopVideoUploadInput"
      responses:
        "200":
          description: Presigned upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopVideoUploadDestination"

  /instructor/workshops/{workshopId}/videos/finalize:
    post:
      operationId: finalizeWorkshopVideoUpload
      tags: [workshops]
      summary: Validate a workshop video upload and set private lesson or public preview access
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopVideoFinalizeInput"
      responses:
        "200":
          description: Validated media reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopVideoMedia"

  /instructor/workshops/{workshopId}:
    patch:
      operationId: updateInstructorWorkshop
      tags: [workshops]
      summary: Set workshop teaser and publication status
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorWorkshopUpdateInput"
      responses:
        "200":
          description: Updated workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"

  /instructor/workshops/{workshopId}/modules/{moduleId}:
    patch:
      operationId: updateWorkshopModule
      tags: [workshops]
      summary: Edit an assigned workshop module and its separate teaser and full lesson files
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopModuleUpdateInput"
      responses:
        "200":
          description: Updated module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopModuleDetail"

  /instructor/workshops/{workshopId}/participants:
    get:
      operationId: listWorkshopParticipants
      tags: [workshops]
      summary: List staff-granted participants in an assigned workshop
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workshop participant roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkshopParticipant"
    post:
      operationId: enrollWorkshopParticipant
      tags: [workshops]
      summary: Grant or pause workshop-specific participant access as assigned staff
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopParticipantInput"
      responses:
        "200":
          description: Participant enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /workshops/{id}/modules/{moduleId}/complete:
    post:
      operationId: completeWorkshopModule
      tags: [workshops]
      summary: Mark a module as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  # ── Enrollments ───────────────────────────────────────────────────────────
  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List current user enrollments
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"

  # ── Assignments ───────────────────────────────────────────────────────────
  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List user assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: submitAssignment
      tags: [assignments]
      summary: Submit an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Submitted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /workshop-reflections:
    post:
      operationId: submitLessonReflection
      tags: [assignments]
      summary: Save a private post-lesson reflection for instructor review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonReflectionInput"
      responses:
        "201":
          description: Reflection saved with the lesson in the student's private learning portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get assignment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  # ── Badges ────────────────────────────────────────────────────────────────
  /badges:
    get:
      operationId: listBadges
      tags: [badges]
      summary: List badges earned by the current user
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  # ── Skill Tracks ──────────────────────────────────────────────────────────
  /skill-tracks:
    get:
      operationId: listSkillTracks
      tags: [skill-tracks]
      summary: List current user skill tracks
      responses:
        "200":
          description: Skill tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillTrack"
    post:
      operationId: createSkillTrack
      tags: [skill-tracks]
      summary: Start a skill track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillTrackInput"
      responses:
        "201":
          description: Created skill track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTrack"

  /skill-tracks/{id}:
    patch:
      operationId: updateSkillTrack
      tags: [skill-tracks]
      summary: Update skill track progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillTrackUpdate"
      responses:
        "200":
          description: Updated skill track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTrack"

  # ── Job Listings ──────────────────────────────────────────────────────────
  /job-listings:
    get:
      operationId: listJobListings
      tags: [job-listings]
      summary: List open studio job listings
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: ["resident", "guest", "apprenticeship", null]
        - name: open
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListing"

  /job-listings/{id}:
    get:
      operationId: getJobListing
      tags: [job-listings]
      summary: Get a job listing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListing"

  /job-listings/{id}/apply:
    post:
      operationId: applyForJob
      tags: [job-listings]
      summary: Apply for a studio position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationInput"
      responses:
        "201":
          description: Job application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  # ── Applications ──────────────────────────────────────────────────────────
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List current user's job applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"

  # ── Community Events ───────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List AIMD community events and pop-ups
      parameters:
        - name: upcoming
          in: query
          schema:
            type: ["boolean", "null"]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Community events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a community event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a community event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/{id}/rsvp:
    post:
      operationId: rsvpToEvent
      tags: [events]
      summary: Toggle RSVP to a community event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated RSVP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/my-rsvps:
    get:
      operationId: listMyRsvps
      tags: [events]
      summary: List events the current user has RSVPed to
      responses:
        "200":
          description: RSVPed events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"

  /events/check-in:
    post:
      operationId: checkInToEvent
      tags: [events]
      summary: Verify a signed QR token and record event attendance
      description: |
        Accepts the raw QR token string produced by GET /events/{id}/qr-token.
        Verifies the HMAC signature and token expiry before recording attendance
        in a dedicated table (separate from RSVPs). Idempotent on duplicate scan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCheckInInput"
      responses:
        "200":
          description: Check-in result (success or validation failure details)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCheckInResult"
        "404":
          description: Event not found

  /events/{id}/qr-token:
    get:
      operationId: getEventQrToken
      tags: [events]
      summary: Generate a server-signed QR check-in token for an event
      description: |
        Returns a signed HMAC-SHA256 token (valid 24 hours) that encodes into the
        event QR code. Restricted to event organizers — callers must supply the
        shared organizer key in the `X-Organizer-Key` request header. The key is
        derived server-side from `SESSION_SECRET`; a missing or wrong key returns
        403. The mobile app scans the QR code and posts the token to
        `POST /events/check-in`.
      security:
        - OrganizerKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Organizer-Key
          in: header
          required: true
          description: >
            HMAC-SHA256 key derived from SESSION_SECRET, scoped to organizer
            access. Obtain from the server admin — do not expose to attendees.
          schema:
            type: string
      responses:
        "200":
          description: Signed check-in token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventQrToken"
        "403":
          description: Missing or invalid X-Organizer-Key header
        "404":
          description: Event not found

