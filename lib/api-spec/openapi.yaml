      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationUpdate"
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeVerificationResult"
        "401":
          description: Authentication required
        "403":
          description: Admin review access required
        "404":
          description: Submission not found

  # ── Post Comments ─────────────────────────────────────────────────────────
  /studio-posts/{id}/comments:
    get:
      operationId: listPostComments
      tags: [studio-posts]
      summary: Retired public feed comments
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "410":
          description: Public comments are retired; historical records are retained but no longer exposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedInteractionUnavailable"
    post:
      operationId: addPostComment
      tags: [studio-posts]
      summary: Retired public feed comment creation
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "410":
          description: Public comments are retired; message the creator directly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedInteractionUnavailable"

  # ── Tattoo Bookings ──────────────────────────────────────────────────────
  /tattoo-bookings:
    post:
      operationId: createTattooBookingDraft
      tags: [tattoo-bookings]
      summary: Start a public tattoo booking intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingInput"
      responses:
        "201":
          description: Booking draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingDraft"
        "400":
          description: Invalid booking details
        "429":
          description: Too many booking requests

  /tattoo-bookings/{bookingId}/references:
    post:
      operationId: uploadTattooBookingReference
      tags: [tattoo-bookings]
      summary: Upload one private reference image to a booking draft
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
        - name: X-Booking-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/TattooBookingReferenceUpload"
      responses:
        "201":
          description: Reference image stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingReference"
        "400":
          description: Invalid image
        "401":
          description: Invalid or expired booking token
        "413":
          description: Image is too large

  /tattoo-bookings/{bookingId}/submit:
    post:
      operationId: submitTattooBooking
      tags: [tattoo-bookings]
      summary: Finalize a tattoo booking and notify the studio
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingFinalizeInput"
      responses:
        "200":
          description: Booking submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingSubmissionResult"
        "401":
          description: Invalid or expired booking token
        "404":
          description: Booking draft not found

  /admin/tattoo-bookings:
    get:
      operationId: listAdminTattooBookings
      tags: [tattoo-bookings]
      summary: List submitted tattoo bookings for admins
      responses:
        "200":
          description: Submitted bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TattooBooking"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /admin/tattoo-bookings/{bookingId}:
    patch:
      operationId: updateAdminTattooBooking
      tags: [tattoo-bookings]
      summary: Update a tattoo booking status
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBooking"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Booking not found

  # ── Instructor ────────────────────────────────────────────────────────────────

  /instructor/me:
    get:
      operationId: getInstructorSelf
      tags: [instructor]
      summary: Get the authenticated instructor's own profile
      responses:
        "200":
          description: Instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required
    patch:
      operationId: updateInstructorSelf
      tags: [instructor]
      summary: Update own instructor profile (bio, avatar, specialties)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorProfileUpdate"
      responses:
        "200":
          description: Updated instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/curriculum:
    get:
      operationId: getInstructorCurriculum
      tags: [instructor]
      summary: List workshops and modules assigned to the authenticated instructor
      responses:
        "200":
          description: Assigned curriculum
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorWorkshopSummary"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/workshops/{workshopId}/modules:
    post:
      operationId: createWorkshopModule
      tags: [instructor]
      summary: Create a new module in an assigned workshop
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopModuleInput"
      responses:
        "201":
          description: Created module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopModuleDetail"
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop

  /instructor/workshops/{workshopId}/modules/{moduleId}/drills:
    post:
      operationId: createDrillPrompt
      tags: [instructor]
      summary: Create a drill prompt for a module (max 30 seconds enforced)
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrillPromptInput"
      responses:
        "201":
          description: Created drill prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillPromptDetail"
        "400":
          description: maxDurationSeconds exceeds 30-second limit
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop

  /instructor/submissions:
    get:
      operationId: listSubmissionQueue
      tags: [instructor]
      summary: List pending assignment submissions for review
      parameters:
        - name: workshopId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: ["pending", "reviewed", "approved", "revision_requested", null]
      responses:
        "200":
          description: Submission queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentReviewItem"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/submissions/{assignmentId}/feedback:
    post:
      operationId: submitAssignmentFeedback
      tags: [instructor]
      summary: Submit text, audio, or video feedback on an assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentFeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentReviewItem"
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop or not instructor
        "404":
          description: Assignment not found

  /admin/instructors:
    get:
      operationId: listInstructors
      tags: [instructor]
      summary: (Admin) List all instructor profiles
      responses:
        "200":
          description: Instructor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
    post:
      operationId: createInstructor
      tags: [instructor]
      summary: (Admin) Create a new instructor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorProfileInput"
      responses:
        "201":
          description: Created instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /admin/instructors/{instructorId}/link-user:
    post:
      operationId: linkInstructorUser
      tags: [instructor]
      summary: (Admin) Link an instructor profile to a user account
      description: |
        Links a verified instructor profile to a DB user account.
        This is the only way to grant the instructor role — metadata never
        bypasses this admin-controlled link validation.
      parameters:
        - name: instructorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkInstructorUserInput"
      responses:
        "200":
          description: Instructor profile updated with linked user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "400":
          description: User already linked to a different instructor profile
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Instructor or user not found

  /admin/instructors/{instructorId}/assign-workshop:
    post:
      operationId: assignInstructorToWorkshop
      tags: [instructor]
      summary: (Admin) Assign an instructor to a workshop
      parameters:
        - name: instructorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInstructorWorkshopInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorWorkshopAssignment"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Instructor or workshop not found
        "409":
          description: Already assigned

  /sms/subscriptions:
    post:
      operationId: createSmsSubscription
      tags: [marketing]
      summary: Start a public double-opt-in SMS subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsSubscriptionInput"
      responses:
        "202":
          description: Confirmation text requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsSubscriptionResult"
        "400":
          description: Invalid contact or consent
        "409":
          description: Number is already subscribed
        "429":
          description: Too many requests
        "503":
          description: SMS subscription service is not configured or unavailable

components:
  securitySchemes:
    OrganizerKey:
      type: apiKey
      in: header
      name: X-Organizer-Key
      description: >
        HMAC-SHA256 key derived from SESSION_SECRET, required to issue QR
        check-in tokens. Must be supplied by event organizers only.

  schemas:
    PracticeMilestoneWeek:
      type: object
      required: [start, end, days, completed, current]
      properties:
        start: { type: string }
        end: { type: string }
        days: { type: integer }
        completed: { type: boolean }
        current: { type: boolean }
    PracticeMilestones:
      type: object
      required: [cycleStart, cycleEnd, currentWeekStart, currentWeekDays, completedWeeks, weeks, weeklyBonus, monthlyBonus]
      properties:
        cycleStart: { type: string }
        cycleEnd: { type: string }
        currentWeekStart: { type: string }
        currentWeekDays: { type: integer }
        completedWeeks: { type: integer }
        weeklyBonus: { type: integer }
        monthlyBonus: { type: integer }
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/PracticeMilestoneWeek"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, username, email, tier, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["free", "workshop", "academy", "pro"]
        studioReadyBadge:
          type: boolean
        isAdmin:
          type: boolean
        points:
          type: integer
        discipline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        bookingOpen:
          type: boolean
        portfolioUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RewardTier:
      type: object
      required: [key, level, points, reward, description, availability, unlocked]
      properties:
        key:
          type: string
          description: Stable milestone identifier, independent of the current reward offering.
        level:
          type: integer
          minimum: 1
        points:
          type: integer
        reward:
          type: string
        description:
          type: string
        availability:
          type: string
          enum: [coming_soon, available]
          description: Earning a milestone does not mean the reward is currently available to claim.
        unlocked:
          type: boolean

    RewardsInfo:
      type: object
      required: [points, tiers, monthlyDrop, recentRequests]
      properties:
        points:
          type: integer
        tiers:
          type: array
          deprecated: true
          description: Always empty. Fixed point reward offers were retired; points are never spent.
          items:
            $ref: "#/components/schemas/RewardTier"
        monthlyDrop:
          anyOf:
            - { $ref: "#/components/schemas/MonthlyDrop" }
            - { type: "null" }
        recentRequests:
          type: array
          description: Most recent 24 requests, including prior months.
          items: { $ref: "#/components/schemas/MonthlyDropRequestHistory" }

    MonthlyDrop:
      type: object
      required: [id, monthKey, title, description, items, stock, remaining, reserved, requestCount, status, ownRequest]
      properties:
        id: { type: integer }
        monthKey: { type: string }
        title: { type: string }
        description: { type: string }
        items: { type: array, items: { type: string } }
        stock: { type: integer }
        remaining: { type: integer }
        reserved: { type: integer }
        requestCount: { type: integer }
        status: { type: string, enum: [draft, open, closed] }
        ownRequest:
          anyOf:
            - { $ref: "#/components/schemas/MonthlyDropRequest" }
            - { type: "null" }
    MonthlyDropRequest:
      type: object
      required: [id, dropId, userId, status, requestedAt, updatedAt]
      properties:
        id: { type: integer }
        dropId: { type: integer }
        userId: { type: [integer, "null"] }
        status: { type: string, enum: [pending, approved, declined, fulfilled] }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MonthlyDropRequestHistory:
      allOf:
        - { $ref: "#/components/schemas/MonthlyDropRequest" }
        - type: object
          required: [monthKey, title]
          properties:
            monthKey: { type: string }
            title: { type: string }
    AdminMonthlyDropRequest:
      allOf:
        - { $ref: "#/components/schemas/MonthlyDropRequest" }
        - type: object
          required: [username]
          properties:
            username: { type: [string, "null"] }
    MonthlyDropRequestsPage:
      type: object
      required: [requests, total, limit, offset]
      properties:
        requests: { type: array, items: { $ref: "#/components/schemas/AdminMonthlyDropRequest" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    MonthlyDropInput:
      type: object
      additionalProperties: false
      required: [monthKey, title, items, stock]
      properties:
        monthKey: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 1500, default: "" }
        items: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 160 } }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        status: { type: string, enum: [draft, open, closed], default: draft }
    MonthlyDropUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 1500 }
        items: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 160 } }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        status: { type: string, enum: [draft, open, closed] }
    MonthlyDropRequestUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [approved, declined, fulfilled] }

    AwardPointsBody:
      type: object
      required: [userId, amount, reason]
      properties:
        userId:
          type: integer
        amount:
          type: integer
        reason:
          type: string
          minLength: 1

    AdminMember:
      type: object
      required: [id, username, email, tier, points, isAdmin, createdAt, postCount]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        tier:
          type: string
        points:
          type: integer
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        postCount:
          type: integer

    PointAwardResult:
      type: object
      required: [userId, amount, points]
      properties:
        userId:
          type: integer
        username:
          type: string
        amount:
          type: integer
        points:
          type: integer

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        avatarUrl:
          type: ["string", "null"]
        discipline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
          maxLength: 500
        location:
          type: ["string", "null"]
        bookingOpen:
          type: boolean
        portfolioUrl:
          type: ["string", "null"]

    PortfolioCategory:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: ["integer", "null"]
        name:
          type: string
        position:
          type: integer

    PortfolioCategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        legacyName:
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 32

    PortfolioCategoriesInput:
      type: object
      required: [categories]
      additionalProperties: false
      properties:
        categories:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/PortfolioCategoryInput"

    UpdateStudioPostCategoryInput:
      type: object
      required: [portfolioCategoryId]
      additionalProperties: false
      properties:
        portfolioCategoryId:
          type: ["integer", "null"]
          minimum: 1

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalHabits, currentStreakDays, longestStreakDays, totalPostsThisMonth, workshopsEnrolled, badgesEarned, completionRate, skillTracksActive]
      properties:
        totalHabits:
          type: integer
        currentStreakDays:
          type: integer
        longestStreakDays:
          type: integer
        totalPostsThisMonth:
          type: integer
        workshopsEnrolled:
          type: integer
        badgesEarned:
          type: integer
        completionRate:
          type: number
        skillTracksActive:
          type: integer
        studioReadyStatus:
          type: boolean

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: ["habit_log", "studio_post", "badge_earned", "module_complete", "enrollment"]
        description:
          type: string
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── Habits ────────────────────────────────────────────────────────────
    Habit:
      type: object
      required: [id, userId, name, category, targetMinutes, currentStreak, longestStreak, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        category:
          type: string
        targetMinutes:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completedToday:
          type: boolean
        createdAt:
          type: string
          format: date-time

    HabitList:
      type: object
      required: [habits, meta]
      properties:
        habits:
          type: array
          items:
            $ref: "#/components/schemas/Habit"
        meta:
          $ref: "#/components/schemas/HabitListMeta"

    HabitListMeta:
      type: object
      required: [tier, habitCount]
      properties:
        tier:
          type: string
          enum: ["free", "workshop", "academy", "pro"]
        habitCount:
          type: integer
          minimum: 0

    HabitInput:
      type: object
      required: [name, category, targetMinutes]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        targetMinutes:
          type: integer
          minimum: 1

    HabitUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        targetMinutes:
          type: integer

    HabitLog:
      type: object
      required: [id, habitId, userId, date, minutesSpent, completed, createdAt]
      properties:
        id:
          type: integer
        habitId:
          type: integer
        userId:
          type: integer
        date:
          type: string
          format: date
        minutesSpent:
          type: integer
        completed:
          type: boolean
        proofUrl:
          type: ["string", "null"]
        proofMediaType:
          type: ["string", "null"]
          enum: ["image", "video", null]
        createdAt:
          type: string
          format: date-time

    HabitLogInput:
      type: object
      required: [minutesSpent, proofUrl, proofMediaType]
      properties:
        minutesSpent:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        proofUrl:
          type: string
          description: Creator-owned image or video proof uploaded for this habit session.
        proofMediaType:
          type: string
          enum: ["image", "video"]

    HeatmapDay:
      type: object
      required: [date, count, level]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
        level:
          type: integer
          description: "0=none, 1=low, 2=medium, 3=high, 4=max"

