    TattooBookingDraft:
      type: object
      required: [id, uploadToken, expiresAt]
      properties:
        id:
          type: integer
        uploadToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    TattooBookingReferenceUpload:
      type: string
      description: Raw image bytes; uploaded with an image Content-Type header.

    TattooBookingReference:
      type: object
      required: [id, url, originalName, contentType, sizeBytes]
      properties:
        id:
          type: integer
        url:
          type: string
        originalName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer

    TattooBookingFinalizeInput:
      type: object
      required: [uploadToken]
      properties:
        uploadToken:
          type: string
          minLength: 32

    TattooBookingSubmissionResult:
      type: object
      required: [id, status, notificationStatus]
      properties:
        id:
          type: integer
        status:
          $ref: "#/components/schemas/TattooBookingStatus"
        notificationStatus:
          $ref: "#/components/schemas/TattooBookingNotificationStatus"

    TattooBooking:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - idea
        - placement
        - estimatedSize
        - preferredArtist
        - status
        - notificationStatus
        - notificationError
        - references
        - submittedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        idea:
          type: string
        placement:
          type: string
        estimatedSize:
          type: string
        preferredArtist:
          type: string
        status:
          $ref: "#/components/schemas/TattooBookingStatus"
        notificationStatus:
          $ref: "#/components/schemas/TattooBookingNotificationStatus"
        notificationError:
          type: ["string", "null"]
        references:
          type: array
          items:
            $ref: "#/components/schemas/TattooBookingReference"
        submittedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TattooBookingUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TattooBookingStatus"

    # ── Creator Progress ──────────────────────────────────────────────────
    ProgressDayInput:
