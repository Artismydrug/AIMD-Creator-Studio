    # ── Tattoo Bookings ────────────────────────────────────────────────────
    TattooBookingStatus:
      type: string
      enum: ["new", "contacted", "scheduled", "completed", "declined"]

    TattooBookingNotificationStatus:
      type: string
      enum: ["pending", "sent", "failed"]

    TattooBookingInput:
      type: object
      required: [name, email, idea, placement, estimatedSize, preferredArtist]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: ["string", "null"]
          maxLength: 40
        idea:
          type: string
          minLength: 10
          maxLength: 4000
        placement:
          type: string
          minLength: 1
          maxLength: 160
        estimatedSize:
          type: string
          minLength: 1
          maxLength: 120
        preferredArtist:
          type: string
          enum: ["No preference", "Poncho The Artist", "Edwin", "Ash"]
        website:
          type: string
          maxLength: 200
