openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Creator Studio by AIMD API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary and activity
  - name: habits
    description: Habit tracking operations
  - name: studio-posts
    description: Public studio log posts
  - name: workshops
    description: Workshop and course operations
  - name: enrollments
    description: User enrollment operations
  - name: assignments
    description: Assignment submission and review
  - name: badges
    description: Badge and achievement operations
  - name: job-listings
    description: Studio job board
  - name: applications
    description: Job applications
  - name: skill-tracks
    description: Skill certification tracks
  - name: events
    description: Community events and pop-ups
  - name: sponsorships
    description: Sponsor a Creator donations
  - name: payments
    description: Stripe payment and subscription operations
  - name: store
    description: AIMD storefront catalog, checkout, and orders
  - name: users
    description: User profile and creator directory
  - name: conversations
    description: Messaging and conversations
  - name: progress
    description: Creator progress, daily check-in, streaks, phases, and badges
  - name: rewards
    description: Daily reward spin and AIMD Points
  - name: challenges
    description: Weekly creative challenge submissions and voting
  - name: instructor
    description: Instructor self-service, curriculum management, submission review, and admin mentor linking

paths:
  # ── Storage ───────────────────────────────────────────────────────────────────
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'


  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity-feed:
    get:
      operationId: getActivityFeed
      tags: [dashboard]
      summary: Recent activity feed (posts + habit logs)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Habits ────────────────────────────────────────────────────────────────
  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List user habits
      responses:
        "200":
          description: User habits with tier limit metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitList"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a new habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/heatmap:
    get:
      operationId: getHabitHeatmap
      tags: [habits]
      summary: Get activity heatmap data for the past year
      responses:
        "200":
          description: Heatmap data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapDay"

  /habits/{id}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
        "404":
          description: Not found
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitUpdate"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /habits/{id}/log:
    post:
      operationId: logHabitSession
      tags: [habits]
      summary: Log a completed habit session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitLogInput"
      responses:
        "201":
          description: Created log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitLog"

  /habit-logs:
    get:
      operationId: listHabitLogs
      tags: [habits]
      summary: Get log history for a habit
      parameters:
        - name: habitId
          in: query
          required: true
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Habit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitLog"

  # ── Studio Posts ──────────────────────────────────────────────────────────
  /studio-posts:
    get:
      operationId: listStudioPosts
      tags: [studio-posts]
      summary: List public studio log posts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: followingOnly
          in: query
          description: Return posts from creators followed by the signed-in user. Requires authentication when true.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Studio posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioPost"
    post:
      operationId: createStudioPost
      tags: [studio-posts]
      summary: Create a studio log post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"

  /studio-posts/{id}:
    get:
      operationId: getStudioPost
      tags: [studio-posts]
      summary: Get a studio post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Studio post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"
    delete:
      operationId: deleteStudioPost
      tags: [studio-posts]
      summary: Delete a studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /studio-posts/{id}/like:
    post:
      operationId: likeStudioPost
      tags: [studio-posts]
      summary: Toggle like on a studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated like count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPost"

  # ── Workshops ─────────────────────────────────────────────────────────────
  /workshops:
    get:
      operationId: listWorkshops
      tags: [workshops]
      summary: List available workshops & masterclasses
      parameters:
        - name: tier
          in: query
          schema:
            type: ["string", "null"]
            enum: ["free", "workshop", "academy", "pro", null]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Workshops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workshop"

  /workshops/{id}:
    get:
      operationId: getWorkshop
      tags: [workshops]
      summary: Get workshop details with modules
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workshop with modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopDetail"

  /workshops/{id}/enroll:
    post:
      operationId: enrollInWorkshop
      tags: [workshops]
      summary: Enroll current user in a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Enrollment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /workshops/{id}/modules/{moduleId}/complete:
    post:
      operationId: completeWorkshopModule
      tags: [workshops]
      summary: Mark a module as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  # ── Enrollments ───────────────────────────────────────────────────────────
  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollments]
      summary: List current user enrollments
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"

  # ── Assignments ───────────────────────────────────────────────────────────
  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List user assignments
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: submitAssignment
      tags: [assignments]
      summary: Submit an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Submitted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get assignment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  # ── Badges ────────────────────────────────────────────────────────────────
  /badges:
    get:
      operationId: listBadges
      tags: [badges]
      summary: List badges earned by the current user
      responses:
        "200":
          description: Badges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"

  # ── Skill Tracks ──────────────────────────────────────────────────────────
  /skill-tracks:
    get:
      operationId: listSkillTracks
      tags: [skill-tracks]
      summary: List current user skill tracks
      responses:
        "200":
          description: Skill tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillTrack"
    post:
      operationId: createSkillTrack
      tags: [skill-tracks]
      summary: Start a skill track
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillTrackInput"
      responses:
        "201":
          description: Created skill track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTrack"

  /skill-tracks/{id}:
    patch:
      operationId: updateSkillTrack
      tags: [skill-tracks]
      summary: Update skill track progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillTrackUpdate"
      responses:
        "200":
          description: Updated skill track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillTrack"

  # ── Job Listings ──────────────────────────────────────────────────────────
  /job-listings:
    get:
      operationId: listJobListings
      tags: [job-listings]
      summary: List open studio job listings
      parameters:
        - name: type
          in: query
          schema:
            type: ["string", "null"]
            enum: ["resident", "guest", "apprenticeship", null]
        - name: open
          in: query
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: Job listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobListing"

  /job-listings/{id}:
    get:
      operationId: getJobListing
      tags: [job-listings]
      summary: Get a job listing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListing"

  /job-listings/{id}/apply:
    post:
      operationId: applyForJob
      tags: [job-listings]
      summary: Apply for a studio position
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationInput"
      responses:
        "201":
          description: Job application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplication"

  # ── Applications ──────────────────────────────────────────────────────────
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List current user's job applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplication"

  # ── Community Events ───────────────────────────────────────────────────────
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List AIMD community events and pop-ups
      parameters:
        - name: upcoming
          in: query
          schema:
            type: ["boolean", "null"]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Community events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a community event (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a community event by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/{id}/rsvp:
    post:
      operationId: rsvpToEvent
      tags: [events]
      summary: Toggle RSVP to a community event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated RSVP state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"

  /events/my-rsvps:
    get:
      operationId: listMyRsvps
      tags: [events]
      summary: List events the current user has RSVPed to
      responses:
        "200":
          description: RSVPed events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"

  /events/check-in:
    post:
      operationId: checkInToEvent
      tags: [events]
      summary: Verify a signed QR token and record event attendance
      description: |
        Accepts the raw QR token string produced by GET /events/{id}/qr-token.
        Verifies the HMAC signature and token expiry before recording attendance
        in a dedicated table (separate from RSVPs). Idempotent on duplicate scan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCheckInInput"
      responses:
        "200":
          description: Check-in result (success or validation failure details)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCheckInResult"
        "404":
          description: Event not found

  /events/{id}/qr-token:
    get:
      operationId: getEventQrToken
      tags: [events]
      summary: Generate a server-signed QR check-in token for an event
      description: |
        Returns a signed HMAC-SHA256 token (valid 24 hours) that encodes into the
        event QR code. Restricted to event organizers — callers must supply the
        shared organizer key in the `X-Organizer-Key` request header. The key is
        derived server-side from `SESSION_SECRET`; a missing or wrong key returns
        403. The mobile app scans the QR code and posts the token to
        `POST /events/check-in`.
      security:
        - OrganizerKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Organizer-Key
          in: header
          required: true
          description: >
            HMAC-SHA256 key derived from SESSION_SECRET, scoped to organizer
            access. Obtain from the server admin — do not expose to attendees.
          schema:
            type: string
      responses:
        "200":
          description: Signed check-in token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventQrToken"
        "403":
          description: Missing or invalid X-Organizer-Key header
        "404":
          description: Event not found

  # ── Sponsorships ───────────────────────────────────────────────────────────
  /sponsorships:
    get:
      operationId: listSponsorships
      tags: [sponsorships]
      summary: List sponsorships / leaderboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Sponsorships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsorship"
    post:
      operationId: createSponsorship
      tags: [sponsorships]
      summary: Sponsor a creator — initiates Stripe checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorshipInput"
      responses:
        "201":
          description: Sponsorship with Stripe checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorshipCheckout"

  # ── Payments ───────────────────────────────────────────────────────────────
  /payments/plans:
    get:
      operationId: listPlans
      tags: [payments]
      summary: List available subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /payments/create-checkout-session:
    post:
      operationId: createCheckoutSession
      tags: [payments]
      summary: Create a Stripe checkout session for a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionInput"
      responses:
        "200":
          description: Checkout session with redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  # ── AIMD Store ────────────────────────────────────────────────────────────
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [store]
      summary: List active AIMD storefront products and prices
      responses:
        "200":
          description: Storefront catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"

  /store/payment-intents:
    post:
      operationId: createStorePaymentIntent
      tags: [store]
      summary: Validate a cart, create an order, and start embedded Stripe payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorePaymentIntentInput"
      responses:
        "201":
          description: Payment intent and pending order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePaymentIntent"

  /store/orders/me:
    get:
      operationId: listMyStoreOrders
      tags: [store]
      summary: List the signed-in creator's storefront purchases
      responses:
        "200":
          description: Purchase history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreOrder"

  /store/orders/{confirmationToken}:
    get:
      operationId: getStoreOrder
      tags: [store]
      summary: Get a storefront order by its private confirmation token
      parameters:
        - in: path
          name: confirmationToken
          required: true
          schema:
            type: string
            minLength: 20
      responses:
        "200":
          description: Order confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrder"

  # ── Users ─────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the current demo user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /rewards:
    get:
      operationId: getRewards
      tags: [users]
      summary: Reward tiers and the current user's AIMD Points balance
      responses:
        "200":
          description: Rewards info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsInfo"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [users]
      summary: (Admin) List all members
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: object
                required: [total, members]
                properties:
                  total:
                    type: integer
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminMember"
        "403":
          description: Admin access required

  /admin/points-awards:
    post:
      operationId: awardPointsAdmin
      tags: [users]
      summary: (Admin) Award AIMD Points to a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardPointsBody"
      responses:
        "201":
          description: Points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAwardResult"
        "403":
          description: Admin access required

  /admin/challenges/{submissionId}/award-winner:
    post:
      operationId: awardChallengeWinner
      tags: [users]
      summary: (Admin) Award the weekly-challenge prize to a submission's creator
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Prize awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointAwardResult"
        "403":
          description: Admin access required
        "409":
          description: Already awarded for that week

  /directory:
    get:
      operationId: listDirectory
      tags: [users]
      summary: List creator directory (studio-ready creators)
      responses:
        "200":
          description: Creator directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectoryCreator"

  /users/{id}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a creator's public profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCreatorProfile"
        "404":
          description: Not found

  /users/{id}/follow:
    post:
      operationId: followUser
      tags: [users]
      summary: Follow a creator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current follow relationship and public counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRelationship"
        "400":
          description: Invalid target or self-follow
        "401":
          description: Authentication required
        "404":
          description: Creator not found
    delete:
      operationId: unfollowUser
      tags: [users]
      summary: Unfollow a creator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current follow relationship and public counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRelationship"
        "401":
          description: Authentication required
        "404":
          description: Creator not found

  # ── Conversations ─────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for the current user
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created or existing conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResult"

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationMessage"
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessage"

  # ── Creator Progress ──────────────────────────────────────────────────────
  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get the current creator's progress summary
      description: |
        Returns points, phase, streaks, recent badges, habit completions,
        check-in status, and today's reward spin availability/result.
        The saved creator timezone is authoritative once established; supply
        `timezone` only on the very first read before any timezone has been saved.
        This parameter is ignored when a valid saved timezone already exists.
      parameters:
        - name: timezone
          in: query
          required: false
          schema:
            type: ["string", "null"]
          description: >
            IANA timezone string (e.g. "America/New_York"). Used only when
            the creator has no saved timezone yet; the server-side saved
            timezone takes priority on all subsequent calls.
      responses:
        "200":
          description: Creator progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "401":
          description: Authentication required

  /progress/check-in:
    post:
      operationId: checkInProgress
      tags: [progress]
      summary: Record a daily check-in for the creator
      description: |
        Idempotent — calling more than once on the same local calendar day
        returns the existing result without awarding points again.
        Awards 10 AIMD Points on the first check-in for each local day.
        Also awards streak milestone badges at 1, 3, 7, 14, and 30 days.

        Timezone rule: the `timezone` field establishes the creator's saved
        timezone on the very first call when no saved value exists. Once a
        valid timezone is stored server-side it becomes authoritative and the
        supplied value is ignored. The local calendar date is computed
        server-side using the authoritative timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressDayInput"
      responses:
        "200":
          description: Updated progress summary (idempotent — same shape whether new or repeat)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"
        "400":
          description: Invalid or missing timezone
        "401":
          description: Authentication required

  /rewards/spin:
    post:
      operationId: spinDailyReward
      tags: [rewards]
      summary: Spin the daily reward wheel
      description: |
        Idempotent once per creator per local calendar date. Weighted outcomes
        are 5, 10, 20, or 50 points. The spin insert, point ledger insert, and
        user balance update are executed in a single transaction.
        Returns the existing result on retries.

        Timezone rule: the `timezone` field establishes the creator's saved
        timezone on the very first call when no saved value exists. Once a
        valid timezone is stored server-side it becomes authoritative and the
        supplied value is ignored. The local calendar date is computed
        server-side using the authoritative timezone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressDayInput"
      responses:
        "200":
          description: Spin result (new or existing for today)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySpinResult"
        "400":
          description: Invalid or missing timezone
        "401":
          description: Authentication required

  # ── Weekly Challenges ─────────────────────────────────────────────────────
  /challenges/current:
    get:
      operationId: getCurrentChallenge
      tags: [challenges]
      summary: Get the current weekly challenge with submissions and vote counts
      responses:
        "200":
          description: Current weekly challenge with ranked submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyChallengeResult"

  /challenges/submit:
    post:
      operationId: submitChallengeEntry
      tags: [challenges]
      summary: Submit an entry to the current weekly challenge
      description: One entry per creator per challenge week. Returns 409 if already submitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeSubmissionInput"
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeSubmissionCreated"
        "401":
          description: Authentication required
        "409":
          description: Already submitted for this week
        "410":
          description: The current weekly challenge has closed

  /challenges/{id}/verification:
    patch:
      operationId: updateChallengeVerification
      tags: [challenges]
      summary: Update a challenge submission verification status
      description: Admin-only review transition for proof-of-work submissions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeVerificationUpdate"
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeVerificationResult"
        "401":
          description: Authentication required
        "403":
          description: Admin review access required
        "404":
          description: Submission not found

  # ── Post Comments ─────────────────────────────────────────────────────────
  /studio-posts/{id}/comments:
    get:
      operationId: listPostComments
      tags: [studio-posts]
      summary: List comments on a studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: addPostComment
      tags: [studio-posts]
      summary: Add a comment (critique) to a studio post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  # ── Tattoo Bookings ──────────────────────────────────────────────────────
  /tattoo-bookings:
    post:
      operationId: createTattooBookingDraft
      tags: [tattoo-bookings]
      summary: Start a public tattoo booking intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingInput"
      responses:
        "201":
          description: Booking draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingDraft"
        "400":
          description: Invalid booking details
        "429":
          description: Too many booking requests

  /tattoo-bookings/{bookingId}/references:
    post:
      operationId: uploadTattooBookingReference
      tags: [tattoo-bookings]
      summary: Upload one private reference image to a booking draft
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
        - name: X-Booking-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              $ref: "#/components/schemas/TattooBookingReferenceUpload"
      responses:
        "201":
          description: Reference image stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingReference"
        "400":
          description: Invalid image
        "401":
          description: Invalid or expired booking token
        "413":
          description: Image is too large

  /tattoo-bookings/{bookingId}/submit:
    post:
      operationId: submitTattooBooking
      tags: [tattoo-bookings]
      summary: Finalize a tattoo booking and notify the studio
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingFinalizeInput"
      responses:
        "200":
          description: Booking submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBookingSubmissionResult"
        "401":
          description: Invalid or expired booking token
        "404":
          description: Booking draft not found

  /admin/tattoo-bookings:
    get:
      operationId: listAdminTattooBookings
      tags: [tattoo-bookings]
      summary: List submitted tattoo bookings for admins
      responses:
        "200":
          description: Submitted bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TattooBooking"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /admin/tattoo-bookings/{bookingId}:
    patch:
      operationId: updateAdminTattooBooking
      tags: [tattoo-bookings]
      summary: Update a tattoo booking status
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TattooBookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TattooBooking"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Booking not found

  # ── Instructor ────────────────────────────────────────────────────────────────

  /instructor/me:
    get:
      operationId: getInstructorSelf
      tags: [instructor]
      summary: Get the authenticated instructor's own profile
      responses:
        "200":
          description: Instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required
    patch:
      operationId: updateInstructorSelf
      tags: [instructor]
      summary: Update own instructor profile (bio, avatar, specialties)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorProfileUpdate"
      responses:
        "200":
          description: Updated instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/curriculum:
    get:
      operationId: getInstructorCurriculum
      tags: [instructor]
      summary: List workshops and modules assigned to the authenticated instructor
      responses:
        "200":
          description: Assigned curriculum
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorWorkshopSummary"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/workshops/{workshopId}/modules:
    post:
      operationId: createWorkshopModule
      tags: [instructor]
      summary: Create a new module in an assigned workshop
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkshopModuleInput"
      responses:
        "201":
          description: Created module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopModuleDetail"
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop

  /instructor/workshops/{workshopId}/modules/{moduleId}/drills:
    post:
      operationId: createDrillPrompt
      tags: [instructor]
      summary: Create a drill prompt for a module (max 30 seconds enforced)
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrillPromptInput"
      responses:
        "201":
          description: Created drill prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrillPromptDetail"
        "400":
          description: maxDurationSeconds exceeds 30-second limit
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop

  /instructor/submissions:
    get:
      operationId: listSubmissionQueue
      tags: [instructor]
      summary: List pending assignment submissions for review
      parameters:
        - name: workshopId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum: ["pending", "reviewed", "approved", "revision_requested", null]
      responses:
        "200":
          description: Submission queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentReviewItem"
        "401":
          description: Authentication required
        "403":
          description: Instructor role required

  /instructor/submissions/{assignmentId}/feedback:
    post:
      operationId: submitAssignmentFeedback
      tags: [instructor]
      summary: Submit text, audio, or video feedback on an assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentFeedbackInput"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentReviewItem"
        "401":
          description: Authentication required
        "403":
          description: Not assigned to this workshop or not instructor
        "404":
          description: Assignment not found

  /admin/instructors:
    get:
      operationId: listInstructors
      tags: [instructor]
      summary: (Admin) List all instructor profiles
      responses:
        "200":
          description: Instructor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
    post:
      operationId: createInstructor
      tags: [instructor]
      summary: (Admin) Create a new instructor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorProfileInput"
      responses:
        "201":
          description: Created instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /admin/instructors/{instructorId}/link-user:
    post:
      operationId: linkInstructorUser
      tags: [instructor]
      summary: (Admin) Link an instructor profile to a user account
      description: |
        Links a verified instructor profile to a DB user account.
        This is the only way to grant the instructor role — metadata never
        bypasses this admin-controlled link validation.
      parameters:
        - name: instructorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkInstructorUserInput"
      responses:
        "200":
          description: Instructor profile updated with linked user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorProfile"
        "400":
          description: User already linked to a different instructor profile
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Instructor or user not found

  /admin/instructors/{instructorId}/assign-workshop:
    post:
      operationId: assignInstructorToWorkshop
      tags: [instructor]
      summary: (Admin) Assign an instructor to a workshop
      parameters:
        - name: instructorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignInstructorWorkshopInput"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorWorkshopAssignment"
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Instructor or workshop not found
        "409":
          description: Already assigned

components:
  securitySchemes:
    OrganizerKey:
      type: apiKey
      in: header
      name: X-Organizer-Key
      description: >
        HMAC-SHA256 key derived from SESSION_SECRET, required to issue QR
        check-in tokens. Must be supplied by event organizers only.

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Users ─────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, username, email, tier, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["free", "workshop", "academy", "pro"]
        studioReadyBadge:
          type: boolean
        isAdmin:
          type: boolean
        points:
          type: integer
        discipline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        bookingOpen:
          type: boolean
        portfolioUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RewardTier:
      type: object
      required: [points, reward, description, unlocked]
      properties:
        points:
          type: integer
        reward:
          type: string
        description:
          type: string
        unlocked:
          type: boolean

    RewardsInfo:
      type: object
      required: [points, challengeWinnerPoints, tiers]
      properties:
        points:
          type: integer
        challengeWinnerPoints:
          type: integer
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/RewardTier"

    AwardPointsBody:
      type: object
      required: [userId, amount, reason]
      properties:
        userId:
          type: integer
        amount:
          type: integer
        reason:
          type: string
          minLength: 1

    AdminMember:
      type: object
      required: [id, username, email, tier, points, isAdmin, createdAt, postCount]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        tier:
          type: string
        points:
          type: integer
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        postCount:
          type: integer

    PointAwardResult:
      type: object
      required: [userId, amount, points]
      properties:
        userId:
          type: integer
        username:
          type: string
        amount:
          type: integer
        points:
          type: integer

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        avatarUrl:
          type: ["string", "null"]
        discipline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
          maxLength: 500
        location:
          type: ["string", "null"]
        bookingOpen:
          type: boolean
        portfolioUrl:
          type: ["string", "null"]

    # ── Dashboard ─────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalHabits, currentStreakDays, longestStreakDays, totalPostsThisMonth, workshopsEnrolled, badgesEarned, completionRate, skillTracksActive]
      properties:
        totalHabits:
          type: integer
        currentStreakDays:
          type: integer
        longestStreakDays:
          type: integer
        totalPostsThisMonth:
          type: integer
        workshopsEnrolled:
          type: integer
        badgesEarned:
          type: integer
        completionRate:
          type: number
        skillTracksActive:
          type: integer
        studioReadyStatus:
          type: boolean

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
