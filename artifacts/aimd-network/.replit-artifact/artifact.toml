kind = "mobile"
previewPath = "/aimd-network/"
title = "Creator Studio by AIMD"
description = "Creator Studio by AIMD is the mobile discipline, community, Workshops & Masterclasses, and professional pathway for discovering, dedicated, and professional artists."
version = "1.0.0"
id = "artifacts/aimd-network"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/aimd-network/" ]
localPort = 20059

[services.development]
run = "pnpm --filter @workspace/aimd-network run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aimd-network", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aimd-network", "run", "serve" ]

[services.env]
PORT = "20059"
BASE_PATH = "/aimd-network/"
