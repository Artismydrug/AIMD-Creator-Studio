kind = "web"
previewPath = "/"
title = "Creator Studio by AIMD"
description = "Creator Studio by AIMD is the official creator development platform for daily discipline, Workshops & Masterclasses, verified instructor feedback, coaching, and professional ecosystem opportunities."
version = "1.0.0"
id = "artifacts/aimd-academy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18439

[services.development]
run = "pnpm --filter @workspace/aimd-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aimd-academy", "run", "build" ]
serve = "static"
publicDir = "artifacts/aimd-academy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18439"
BASE_PATH = "/"
